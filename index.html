<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excal Coder IDE</title>
    <style>
        body { margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: white; font-family: sans-serif; }
        #editor-side { flex: 3; display: flex; flex-direction: column; border-right: 1px solid #333; }
        #file-tab { background: #2d2d2d; padding: 8px; border-bottom: 1px solid #333; font-size: 13px; color: #ccc; }
        #editor-container { flex: 1; }
        #chat-side { flex: 1; display: flex; flex-direction: column; background: #252526; min-width: 320px; }
        .chat-header { padding: 15px; background: #333; font-weight: bold; border-bottom: 1px solid #444; }
        #history { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .msg-user { align-self: flex-end; background: #0e639c; padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
        .msg-ai { align-self: flex-start; background: #3c3c3c; padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
        .msg-tool { align-self: center; color: #888; font-size: 12px; font-style: italic; background: #2d2d2d; padding: 4px 8px; border-radius: 4px;}
        
        /* The MIG Gate Popup */
        .mig-gate { align-self: center; background: #4d2c2c; border: 1px solid #ff4444; padding: 12px; border-radius: 8px; width: 90%; display: none; }
        .mig-gate.active { display: block; }
        .mig-gate input { width: 100%; padding: 8px; margin-top: 8px; box-sizing: border-box; background: #1e1e1e; border: 1px solid #555; color: white; }
        .mig-gate button { width: 100%; margin-top: 8px; padding: 8px; background: #0e639c; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .mig-gate button:hover { background: #1177bb; }

        #input-area { padding: 15px; border-top: 1px solid #444; }
        #input { width: 100%; padding: 10px; box-sizing: border-box; background: #3c3c3c; color: white; border: 1px solid #555; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="editor-side">
        <div id="file-tab">📄 (no file)</div>
        <div id="editor-container"></div>
    </div>
    <div id="chat-side">
        <div class="chat-header">⚡ Excal Coder</div>
        <div id="history"></div>
        <div id="input-area">
            <input type="text" id="input" placeholder="Ask Excal...">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        let editor, ws;
        const LANGS = {py:'python', js:'javascript', ts:'typescript', html:'html', css:'css', json:'json', md:'markdown'};

        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: '// Excal Coder\n', language: 'javascript', theme: 'vs-dark', automaticLayout: true
            });
            connect();
        });

        function connect() {
            ws = new WebSocket(`ws://${window.location.host}`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                
                if (msg.type === 'tool_call') {
                    add('tool', `🛠️ ${msg.tool} ${JSON.stringify(msg.args).substring(0,60)} ${msg.constraints ? '(Constrained: '+msg.constraints+')' : ''}`);
                }
                if (msg.type === 'tool_result') {
                    add('tool', `✅ ${msg.result.toString().substring(0,100)}`);
                    if (msg.file && msg.content !== undefined) {
                        editor.setValue(msg.content);
                        const ext = msg.file.split('.').pop();
                        monaco.editor.setModelLanguage(editor.getModel(), LANGS[ext] || 'plaintext');
                        document.getElementById('file-tab').textContent = '📄 ' + msg.file;
                    }
                }
                if (msg.type === 'mig_verdict') add('tool', '🛡️ MIG VERDICT: ' + msg.verdict);

                if (msg.type === 'final') {
                    add('ai', msg.content);
                }
                if (msg.type === 'error') {
                    add('tool', '❌ ' + msg.content);
                }

                // --- THE MIG GATE UI ---
                if (msg.type === 'approval_needed') {
                    showMigGate(msg.plan);
                }
            };
        }

        function showMigGate(plan) {
            const oldGate = document.getElementById('mig-gate');
            if (oldGate) oldGate.remove();

            const hist = document.getElementById('history');
            const gate = document.createElement('div');
            gate.id = 'mig-gate';
            gate.className = 'mig-gate active';
            
            // Handle both write_file and run_command
            const isCmd = plan.tool === 'run_command';
            const title = isCmd
                ? '🛡️ MIG GATE: Agent wants to RUN a command'
                : `🛡️ MIG GATE: Agent wants to write to "${plan.args.path}"`;
            const preview = isCmd ? ('$ ' + (plan.args.command || '')) : (plan.args.content || '');
            const safeCode = preview.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            gate.innerHTML = `
                <div style="color:#ff8888; font-weight:bold; margin-bottom:8px;">${title}</div>
                <div style="background:#000; padding:10px; border-radius:4px; max-height:200px; overflow-y:auto; margin-bottom:10px; border:1px solid #ff4444;">
                    <pre style="margin:0; font-family:monospace; font-size:12px; white-space:pre-wrap; color:#d4d4d4;">${safeCode}</pre>
                </div>
                <div style="font-size:12px; color:#ccc; margin-bottom:4px;">What should the agent absolutely NOT do? (Leave blank to just approve)</div>
                <input type="text" id="constraint-input" placeholder="e.g., do not install packages, do not delete files...">
                <button id="approve-btn">Apply & Execute</button>
            `;
            hist.appendChild(gate);
            hist.scrollTop = 999999;

            document.getElementById('approve-btn').addEventListener('click', () => {
                const constraints = document.getElementById('constraint-input').value;
                ws.send(JSON.stringify({ type: 'approve', constraints: constraints }));
                
                gate.classList.remove('active');
                gate.innerHTML = `<div style="color:#88ff88;">✅ Sent to MIG for verdict...</div>`;
                setTimeout(() => gate.remove(), 2000);
            });
        }

        function add(type, text) {
            const d = document.createElement('div');
            d.className = 'msg-' + type;
            d.textContent = text;
            document.getElementById('history').appendChild(d);
            document.getElementById('history').scrollTop = 999999;
        }

        document.getElementById('input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                add('user', e.target.value);
                ws.send(JSON.stringify({ type: 'chat', message: e.target.value }));
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
